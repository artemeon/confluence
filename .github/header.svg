      <stop offset="0" stop-color="#2684ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00b8d9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1d3d"/>
      <stop offset="1" stop-color="#0a1328"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#050814"/>
