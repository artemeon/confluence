    <ellipse cx="260" cy="430" rx="400" ry="150" fill="#0052cc" fill-opacity="0.6" filter="url(#blur)"/>
    <ellipse cx="1000" cy="-40" rx="360" ry="140" fill="#2684ff" fill-opacity="0.35" filter="url(#blur)"/>
    <ellipse cx="1140" cy="380" rx="240" ry="110" fill="#00b8d9" fill-opacity="0.22" filter="url(#blur)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

