<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="artemeon/confluence: Download Confluence pages as clean, local HTML">
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="16"/>
    </clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="850" y="175" width="190" height="50">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
